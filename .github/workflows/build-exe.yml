name: Build exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to attach the exe to a release on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check samples
        run: python check_samples.py
      - name: Build
        run: |
          pip install pyinstaller
          python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: polystar-trace-converter-windows
          path: dist/polystar-trace-converter.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/polystar-trace-converter.exe
